[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hanOS-CLI"
version = "0.1.0"
description = "A simple developer-friendly command-line toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}

[project.scripts]
han = "han.cli:main"

[project.optional-dependencies]
dev = [
    "pytest"
]
